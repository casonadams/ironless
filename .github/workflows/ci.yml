name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CC_wasm32_unknown_unknown: clang
  AR_wasm32_unknown_unknown: llvm-ar
  # nsh builds an app's runners in app/target by default; the workspace target is the one rust-cache keeps.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - name: Type-check the app against the crate's declarations
        working-directory: app
        run: nsh check
      - name: Run the app's tests headless
        working-directory: app
        run: nsh test

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Package the web app
        working-directory: app
        run: nsh package --target web --out "$GITHUB_WORKSPACE/dist"
      - run: touch dist/ironless/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/ironless

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [rust, app, web]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
